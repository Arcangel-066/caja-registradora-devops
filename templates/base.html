<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Caja Registradora Inteligente{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">🧾 Caja Registradora Inteligente</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('index') }}">Panel</a>
            <a class="nav-link" href="{{ url_for('listar_productos') }}">Productos</a>
            <a class="nav-link" href="{{ url_for('registrar_venta_form') }}">Nueva venta</a>
            <a class="nav-link" href="{{ url_for('historial_ventas') }}">Historial</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for categoria, mensaje in messages %}
                <div class="alert alert-{{ 'danger' if categoria == 'error' else 'success' }}">
                    {{ mensaje }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
